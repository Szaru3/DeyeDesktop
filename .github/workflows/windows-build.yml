name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          install-deps: 'false'

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Run unit tests
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure

      - name: Package portable Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/DeyeDesktop | Out-Null
          Copy-Item build/deye-desktop.exe dist/DeyeDesktop/
          windeployqt --release --qmldir qml --no-translations --no-compiler-runtime dist/DeyeDesktop/deye-desktop.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeyeDesktop-Windows-x64
          path: dist/DeyeDesktop/
          if-no-files-found: error
